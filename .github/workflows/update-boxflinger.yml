name: Update Boxflinger

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  update-boxflinger:
    name: Update Boxflinger
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check if update is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/update-boxflinger.sh --ci --only-check

      - name: Install Nix
        if: steps.check.outputs.should_update == 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Setup Nix Magic Cache
        if: steps.check.outputs.should_update == 'true'
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Update version
        id: update
        if: steps.check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/update-boxflinger.sh --ci

      - name: Build packages
        if: steps.check.outputs.should_update == 'true'
        run: |
          nix flake check
          for package in $(nix flake show --json 2>/dev/null | jq -r '.packages."x86_64-linux" | keys | .[]'); do
              nix build --system 'x86_64-linux' ".#$package"
          done

      - name: Commit changes
        id: commit
        if: steps.check.outputs.should_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "${{ steps.update.outputs.commit_message }}"
          file_pattern: "*"
