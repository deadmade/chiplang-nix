name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: update-flake-inputs
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    strategy:
      # Keep going if one input fails, and never let two jobs race to push.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Chippy
            repo: chippy
            input: chippy-src
            key: chippy
          - name: Boxflinger
            repo: boxflinger
            input: boxflinger
            key: boxflinger
          - name: Depthfinder
            repo: depthfinder
            input: depthfinder-src
            key: depthfinder
          - name: dfn-mounter
            repo: dfn-mounter
            input: dfn-mounter-src
            key: dfn-mounter
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Start from the branch tip, not the run's triggering SHA. `max-parallel: 1`
          # means an earlier matrix job may already have pushed its own bump; checking
          # out github.sha leaves this job behind the branch and its push is rejected
          # as non-fast-forward.
          ref: ${{ github.ref_name }}

      - name: Check if update is needed
        id: check
        env:
          REPO: ${{ matrix.repo }}
          INPUT: ${{ matrix.input }}
          KEY: ${{ matrix.key }}
        run: |
          .github/update-flake-input.sh \
            --repo "$REPO" --input "$INPUT" --key "$KEY" --ci --only-check

      - name: Install Nix
        if: steps.check.outputs.should_update == 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Setup Nix Magic Cache
        if: steps.check.outputs.should_update == 'true'
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Update version
        id: update
        if: steps.check.outputs.should_update == 'true'
        env:
          REPO: ${{ matrix.repo }}
          INPUT: ${{ matrix.input }}
          KEY: ${{ matrix.key }}
        run: |
          .github/update-flake-input.sh \
            --repo "$REPO" --input "$INPUT" --key "$KEY" --ci

      - name: Build packages
        id: build
        if: steps.check.outputs.should_update == 'true'
        env:
          BASE_MSG: ${{ steps.update.outputs.commit_message }}
        run: |
          msg="$BASE_MSG"
          # Upstream regularly raises the `go` directive in go.mod. The pinned
          # nixpkgs then ships too old a Go and buildGoModule fails, so refresh
          # nixpkgs once and retry before giving up.
          if ! .github/build-all.sh; then
            echo "::warning::Build failed - refreshing nixpkgs for Go toolchain drift and retrying"
            nix flake update nixpkgs
            .github/build-all.sh
            msg="${msg}"$'\n\n'"Refresh nixpkgs to satisfy the upstream Go toolchain requirement."
          fi
          {
            echo "commit_message<<COMMIT_MSG_EOF"
            echo "$msg"
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit changes
        id: commit
        if: steps.check.outputs.should_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "${{ steps.build.outputs.commit_message }}"
          file_pattern: "*"

      # An input that failed for a while and then started working again used to
      # leave its ticket open forever. Close it as soon as the bump lands.
      - name: Close resolved failure issue
        if: success() && steps.check.outputs.should_update == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.name }}
          KEY: ${{ matrix.key }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Automated update failed: ${NAME}"

          existing=$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")] | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment \
              "\`${KEY}\` updated to \`${LATEST_VERSION}\` successfully in ${RUN_URL}. Closing."
          fi

      # An upstream release that restructures a file we patch breaks the build
      # every single night. Fold those runs into one ticket instead of leaving a
      # trail of red runs nobody reads. Never mask the failure: the job stays red.
      - name: Report failure
        if: failure() && steps.check.outputs.should_update == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.name }}
          KEY: ${{ matrix.key }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          title="Automated update failed: ${NAME}"

          # Blaming the patch series unconditionally sent us hunting through
          # `patches/` for failures that were really a rejected push. Name the
          # step that actually failed.
          if [ "$UPDATE_OUTCOME" = "failure" ]; then
            reason=$(cat <<'EOF'
          Rewriting the pin and refreshing `flake.lock` failed, so nothing was built.
          Check that the upstream tag still exists and that `nix flake update` can
          fetch it.
          EOF
          )
          elif [ "$BUILD_OUTCOME" = "failure" ]; then
            reason=$(cat <<'EOF'
          The build failed. The usual cause is a stale patch in `patches/`: upstream
          restructured a file the series touches, so `patchPhase` rejects hunks.
          Regenerate the affected patches against the new tag from a real upstream
          checkout, and refresh `vendorHash` in `pkgs/default.nix` if `go.sum` changed.
          EOF
          )
          elif [ "$COMMIT_OUTCOME" = "failure" ]; then
            reason=$(cat <<'EOF'
          The build succeeded but the push was rejected. Another job in this run
          pushed first and this one is working from a stale checkout. Nothing is
          wrong with the packaging - re-run the workflow to pick the update back up.
          EOF
          )
          else
            reason="The job failed outside the update, build and commit steps. See the run log."
          fi

          body=$(cat <<EOF
          Updating \`${KEY}\` from \`${CURRENT_VERSION}\` to \`${LATEST_VERSION}\` failed.

          Failing run: ${RUN_URL}

          ${reason}

          This issue is reused for every later failure of the same input, so it will
          collect a comment per run until the build is fixed. It closes itself once
          the update lands.
          EOF
          )

          existing=$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")] | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
