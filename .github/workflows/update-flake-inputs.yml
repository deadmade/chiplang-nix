name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: update-flake-inputs
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      # Keep going if one input fails, and never let two jobs race to push.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: ChipLang
            repo: chippy
            input: chip-go
            key: chiplang
          - name: Boxflinger
            repo: boxflinger
            input: boxflinger
            key: boxflinger
          - name: Depthfinder
            repo: depthfinder
            input: depthfinder-src
            key: depthfinder
          - name: dfn-mounter
            repo: dfn-mounter
            input: dfn-mounter-src
            key: dfn-mounter
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check if update is needed
        id: check
        env:
          REPO: ${{ matrix.repo }}
          INPUT: ${{ matrix.input }}
          KEY: ${{ matrix.key }}
        run: |
          .github/update-flake-input.sh \
            --repo "$REPO" --input "$INPUT" --key "$KEY" --ci --only-check

      - name: Install Nix
        if: steps.check.outputs.should_update == 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Setup Nix Magic Cache
        if: steps.check.outputs.should_update == 'true'
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Update version
        id: update
        if: steps.check.outputs.should_update == 'true'
        env:
          REPO: ${{ matrix.repo }}
          INPUT: ${{ matrix.input }}
          KEY: ${{ matrix.key }}
        run: |
          .github/update-flake-input.sh \
            --repo "$REPO" --input "$INPUT" --key "$KEY" --ci

      - name: Build packages
        id: build
        if: steps.check.outputs.should_update == 'true'
        env:
          BASE_MSG: ${{ steps.update.outputs.commit_message }}
        run: |
          msg="$BASE_MSG"
          # Upstream regularly raises the `go` directive in go.mod. The pinned
          # nixpkgs then ships too old a Go and buildGoModule fails, so refresh
          # nixpkgs once and retry before giving up.
          if ! .github/build-all.sh; then
            echo "::warning::Build failed - refreshing nixpkgs for Go toolchain drift and retrying"
            nix flake update nixpkgs
            .github/build-all.sh
            msg="${msg}"$'\n\n'"Refresh nixpkgs to satisfy the upstream Go toolchain requirement."
          fi
          {
            echo "commit_message<<COMMIT_MSG_EOF"
            echo "$msg"
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.check.outputs.should_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "${{ steps.build.outputs.commit_message }}"
          file_pattern: "*"
